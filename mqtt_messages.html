<!DOCTYPE html>
<html>
<head>
    <title>MQTT消息记录</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .message { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .timestamp { color: #666; font-size: 0.9em; }
        .topic { font-weight: bold; color: #2c3e50; }
        .content { margin-top: 5px; }
    </style>
</head>
<body>
    <h1>MQTT消息记录</h1>
    <div id="messages-container">

        <div class="message">
            <div class="timestamp">2026-01-17 08:26:39</div>
            <div class="topic">主题: 864865083061953</div>
            <div class="content">{
  "msg": "nb"
}
</div>
        </div>
            <p>系统启动时间: 2026-01-17 08:24:33</p>
    </div>
</body>
</html>
